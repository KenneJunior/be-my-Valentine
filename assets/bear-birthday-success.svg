<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="100%" height="100%" style="max-width: 280px;">
  <defs>
    <!-- Richer, warmer fur gradient -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff5f8"/>
      <stop offset="100%" stop-color="#fbdde7"/>
    </linearGradient>

    <!-- Softer, more blended belly -->
    <radialGradient id="bellyGrad" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#ffcadd"/>
    </radialGradient>

    <linearGradient id="innerEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9eb5"/>
      <stop offset="100%" stop-color="#ff5c85"/>
    </linearGradient>

    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff477e" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff7597" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffccd5" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant Glassy Balloon Gradients -->
    <linearGradient id="balloonPink" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff9eb5"/>
      <stop offset="40%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#a0133b"/>
    </linearGradient>

    <linearGradient id="balloonGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffeea8"/>
      <stop offset="40%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#cc6a00"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe478"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>

    <!-- Liquid Glass Reflection &amp; Specular Rim Gradients -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="specularRim" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shimmerGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Premium Multi-Layered Drop Shadow for Depth -->
    <filter id="premiumGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#e8436e" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#ff4d6d" flood-opacity="0.28"/>
    </filter>

    <style>
      /* 1. Organic Spring-Damper Physics with Harmonic Overshoot */
      @keyframes victorySpringJump {
        0% {
          transform: translateY(0px) scale(1, 1) rotate(0deg);
        }
        9% {
          /* Anticipation coil spring compression */
          transform: translateY(12px) scale(1.16, 0.84) rotate(0deg);
        }
        22% {
          /* Explosive spring upward launch */
          transform: translateY(-18px) scale(0.88, 1.16) rotate(1deg);
        }
        36% {
          /* Deceleration into apex */
          transform: translateY(-48px) scale(0.92, 1.1) rotate(2deg);
        }
        48% {
          /* Weightless apex float hang-time with balloon lift */
          transform: translateY(-51px) scale(1.03, 0.97) rotate(0.6deg);
        }
        64% {
          /* Downward plunge with aerodynamic stretch */
          transform: translateY(-14px) scale(0.89, 1.15) rotate(-0.8deg);
        }
        74% {
          /* Maximum impact squash - kinetic dissipation */
          transform: translateY(14px) scale(1.26, 0.74) rotate(0deg);
        }
        84% {
          /* Elastic rebound spring overshoot */
          transform: translateY(-11px) scale(0.93, 1.08) rotate(-0.5deg);
        }
        92% {
          /* Secondary settle */
          transform: translateY(3px) scale(1.04, 0.97) rotate(0.2deg);
        }
        100% {
          transform: translateY(0px) scale(1, 1) rotate(0deg);
        }
      }

      /* 2. Secondary Overlapping Physics: Head bobs with phase lag */
      @keyframes headSpringLag {
        0% { transform: translateY(0px) rotate(0deg); }
        9% { transform: translateY(3px) rotate(1deg); }
        22% { transform: translateY(-4px) rotate(-2deg); }
        36% { transform: translateY(-3px) rotate(2.5deg); }
        48% { transform: translateY(-1px) rotate(-1deg); }
        64% { transform: translateY(-3px) rotate(1.5deg); }
        74% { transform: translateY(5px) rotate(-2deg); }
        84% { transform: translateY(-3px) rotate(1deg); }
        92% { transform: translateY(1px) rotate(0deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      /* 3. Secondary Spring Inertia: Ears whip and oscillate */
      @keyframes earFlopLeftSpring {
        0% { transform: rotate(0deg) scale(1); }
        9% { transform: rotate(10deg) scale(1.05, 0.95); }
        22% { transform: rotate(-16deg) scale(0.93, 1.09); }
        36% { transform: rotate(14deg) scale(1.04, 0.96); }
        48% { transform: rotate(6deg) scale(1, 1); }
        64% { transform: rotate(-14deg) scale(0.94, 1.07); }
        74% { transform: rotate(20deg) scale(1.14, 0.85); }
        84% { transform: rotate(-9deg) scale(0.95, 1.06); }
        92% { transform: rotate(3deg) scale(1.02, 0.98); }
        100% { transform: rotate(0deg) scale(1); }
      }

      @keyframes earFlopRightSpring {
        0% { transform: rotate(0deg) scale(1); }
        9% { transform: rotate(-10deg) scale(1.05, 0.95); }
        22% { transform: rotate(16deg) scale(0.93, 1.09); }
        36% { transform: rotate(-14deg) scale(1.04, 0.96); }
        48% { transform: rotate(-6deg) scale(1, 1); }
        64% { transform: rotate(14deg) scale(0.94, 1.07); }
        74% { transform: rotate(-20deg) scale(1.14, 0.85); }
        84% { transform: rotate(9deg) scale(0.95, 1.06); }
        92% { transform: rotate(-3deg) scale(1.02, 0.98); }
        100% { transform: rotate(0deg) scale(1); }
      }

      /* Dynamic ground shadow with attenuation */
      @keyframes groundShadowVictory {
        0% { transform: scale(1, 1); opacity: 0.40; }
        9% { transform: scale(1.30, 1.22); opacity: 0.58; }
        22% { transform: scale(0.72, 0.66); opacity: 0.20; }
        36%, 48% { transform: scale(0.42, 0.38); opacity: 0.08; }
        64% { transform: scale(0.78, 0.72); opacity: 0.22; }
        74% { transform: scale(1.38, 1.32); opacity: 0.68; }
        84% { transform: scale(0.85, 0.80); opacity: 0.26; }
        92% { transform: scale(1.08, 1.05); opacity: 0.45; }
        100% { transform: scale(1, 1); opacity: 0.40; }
      }

      /* Buoyant, reactive balloon sway with tether tension */
      @keyframes balloonSpringFloat1 {
        0%, 100% { transform: translateY(0px) rotate(-3deg) scale(1); }
        22% { transform: translateY(6px) rotate(-6deg) scale(0.97, 1.04); }
        48% { transform: translateY(-16px) rotate(4deg) scale(1.03, 0.98); }
        74% { transform: translateY(4px) rotate(-2deg) scale(0.98, 1.02); }
      }

      @keyframes balloonSpringFloat2 {
        0%, 100% { transform: translateY(0px) rotate(3deg) scale(1); }
        22% { transform: translateY(8px) rotate(5deg) scale(0.96, 1.04); }
        48% { transform: translateY(-18px) rotate(-4deg) scale(1.04, 0.97); }
        74% { transform: translateY(5px) rotate(2deg) scale(0.97, 1.03); }
      }

      @keyframes armWaveLeft {
        0%, 100% { transform: rotate(-32deg); }
        22% { transform: rotate(-22deg); }
        48% { transform: rotate(-58deg); }
        74% { transform: rotate(-24deg); }
        84% { transform: rotate(-40deg); }
      }

      @keyframes armWaveRight {
        0%, 100% { transform: rotate(32deg); }
        22% { transform: rotate(22deg); }
        48% { transform: rotate(58deg); }
        74% { transform: rotate(24deg); }
        84% { transform: rotate(40deg); }
      }

      /* Faux-3D Confetti Flip with Sparkle */
      @keyframes confettiPop {
        0% { transform: translateY(12px) scaleX(1) rotate(0deg); opacity: 0; }
        20% { opacity: 1; }
        50% { transform: translateY(-28px) scaleX(0.2) rotate(180deg); }
        100% { transform: translateY(0px) scaleX(1) rotate(360deg); opacity: 0.85; }
      }

      /* Specular gleam pass */
      @keyframes gleamPass {
        0% { transform: translateX(-40px) skewX(-25deg); opacity: 0; }
        30%, 70% { opacity: 0.75; }
        100% { transform: translateX(50px) skewX(-25deg); opacity: 0; }
      }

      /* Application of Animations */
      .bear-victory-rig {
        animation: victorySpringJump 1.25s cubic-bezier(0.28, 0.84, 0.36, 1) infinite;
        transform-origin: 140px 210px;
      }
      .head-rig {
        animation: headSpringLag 1.25s cubic-bezier(0.28, 0.84, 0.36, 1) infinite;
        transform-origin: 140px 140px;
      }
      .ear-left-rig {
        animation: earFlopLeftSpring 1.25s cubic-bezier(0.3, 0.8, 0.4, 1) infinite;
        transform-origin: 105px 95px;
      }
      .ear-right-rig {
        animation: earFlopRightSpring 1.25s cubic-bezier(0.3, 0.8, 0.4, 1) infinite;
        transform-origin: 175px 95px;
      }
      .ground-shadow-anim {
        animation: groundShadowVictory 1.25s cubic-bezier(0.28, 0.84, 0.36, 1) infinite;
        transform-origin: 140px 218px;
      }
      .balloons-anim-1 { animation: balloonSpringFloat1 1.25s ease-in-out infinite; transform-origin: 38px 70px; }
      .balloons-anim-2 { animation: balloonSpringFloat2 1.25s ease-in-out infinite; transform-origin: 68px 70px; }

      .arm-left { animation: armWaveLeft 1.25s ease-in-out infinite; transform-origin: 104px 145px; }
      .arm-right { animation: armWaveRight 1.25s ease-in-out infinite; transform-origin: 176px 145px; }

      .confetti-1 { animation: confettiPop 1.6s ease-in-out infinite; transform-origin: center; }
      .confetti-2 { animation: confettiPop 1.6s ease-in-out infinite 0.25s; transform-origin: center; }
      .confetti-3 { animation: confettiPop 1.6s ease-in-out infinite 0.5s; transform-origin: center; }
    </style>
  </defs>

  <!-- Floating Bobbing Balloons -->
  <g>
    <!-- Pink Balloon -->
    <g class="balloons-anim-1" transform="translate(38, 48)">
      <ellipse cx="0" cy="0" rx="18" ry="22" fill="url(#balloonPink)"/>
      <polygon points="0,22 -3,26 3,26" fill="#a0133b"/>
      <!-- Glass reflection overlay -->
      <ellipse cx="-4" cy="-8" rx="8" ry="12" fill="url(#glassReflection)" transform="rotate(-30 -4 -8)"/>
      <!-- Crisp Specular Pin-point Glint -->
      <circle cx="-6" cy="-12" r="2" fill="#ffffff" opacity="0.95"/>
      <circle cx="-8" cy="-8" r="1" fill="#ffffff" opacity="0.8"/>
      <!-- Bottom Rim Reflection Arc -->
      <path d="M 6 10 C 8 16 2 20 -4 20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
      <path d="M 0 26 Q -6 60 16 100" fill="none" stroke="#d9778e" stroke-width="1.5" stroke-dasharray="2,3" stroke-linecap="round"/>
    </g>
    <!-- Gold Balloon -->
    <g class="balloons-anim-2" transform="translate(68, 38)">
      <ellipse cx="0" cy="0" rx="16" ry="20" fill="url(#balloonGold)"/>
      <polygon points="0,20 -3,24 3,24" fill="#cc6a00"/>
      <ellipse cx="-3" cy="-7" rx="7" ry="10" fill="url(#glassReflection)" transform="rotate(-30 -3 -7)"/>
      <!-- Crisp Specular Pin-point Glint -->
      <circle cx="-5" cy="-11" r="1.8" fill="#ffffff" opacity="0.95"/>
      <circle cx="-7" cy="-7" r="0.9" fill="#ffffff" opacity="0.8"/>
      <!-- Bottom Rim Reflection Arc -->
      <path d="M 5 9 C 7 14 1 18 -3 18" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
      <path d="M 0 24 Q -12 60 -10 110" fill="none" stroke="#d9778e" stroke-width="1.5" stroke-dasharray="2,3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Staggered Faux-3D Confetti -->
  <g>
    <rect class="confetti-1" x="220" y="30" width="8" height="10" rx="2" fill="#06d6a0" transform="rotate(15 220 30)"/>
    <rect class="confetti-2" x="245" y="60" width="10" height="6" rx="2" fill="#ff006e" transform="rotate(-20 245 60)"/>
    <rect class="confetti-3" x="210" y="90" width="8" height="8" rx="2" fill="#3a86ff" transform="rotate(45 210 90)"/>
    <circle class="confetti-1" cx="255" cy="40" r="4.5" fill="url(#goldGrad)"/>
    <polygon class="confetti-2" points="230,115 233,121 239,122 235,126 236,132 230,129 224,132 225,126 221,122 227,121" fill="url(#goldGrad)"/>
  </g>

  <!-- Premium Diffused Ground Shadow -->
  <ellipse cx="140" cy="218" rx="52" ry="10" fill="#d85a7b" class="ground-shadow-anim"/>

  <!-- Main Jumping Victory Bear -->
  <g class="bear-victory-rig" filter="url(#premiumGlow)">

    <!-- Feet -->
    <g id="feet">
      <ellipse cx="114" cy="204" rx="17" ry="14" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2"/>
      <ellipse cx="114" cy="205" rx="8" ry="6.5" fill="url(#innerEarGrad)"/>
      <circle cx="109" cy="197" r="2.2" fill="#ff5c85"/>
      <circle cx="114" cy="195" r="2.2" fill="#ff5c85"/>
      <circle cx="119" cy="197" r="2.2" fill="#ff5c85"/>

      <ellipse cx="166" cy="204" rx="17" ry="14" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2"/>
      <ellipse cx="166" cy="205" rx="8" ry="6.5" fill="url(#innerEarGrad)"/>
      <circle cx="161" cy="197" r="2.2" fill="#ff5c85"/>
      <circle cx="166" cy="195" r="2.2" fill="#ff5c85"/>
      <circle cx="171" cy="197" r="2.2" fill="#ff5c85"/>
    </g>

    <!-- Bear Body -->
    <ellipse cx="140" cy="166" rx="48" ry="42" fill="url(#furGrad)" stroke="#ecaab9" stroke-width="2.5"/>
    <!-- Body Left Rim Specular Lighting -->
    <path d="M 97 150 C 94 162 96 177 105 188 C 102 176 100 163 103 152 Z" fill="url(#specularRim)" opacity="0.75"/>
    <ellipse cx="140" cy="170" rx="32" ry="26" fill="url(#bellyGrad)"/>
    <!-- Belly Top Specular Gloss Arc -->
    <ellipse cx="140" cy="152" rx="19" ry="4.5" fill="#ffffff" opacity="0.6"/>

    <!-- Left Arm -->
    <g class="arm-left">
      <ellipse cx="90" cy="132" rx="15" ry="10" fill="url(#furGrad)" stroke="#ecaab9" stroke-width="2.5"/>
      <circle cx="86" cy="132" r="5" fill="url(#innerEarGrad)"/>
      <ellipse cx="91" cy="129" rx="7" ry="2.5" fill="#ffffff" opacity="0.65"/>
    </g>

    <!-- Right Arm -->
    <g class="arm-right">
      <ellipse cx="190" cy="132" rx="15" ry="10" fill="url(#furGrad)" stroke="#ecaab9" stroke-width="2.5"/>
      <circle cx="194" cy="132" r="5" fill="url(#innerEarGrad)"/>
      <ellipse cx="189" cy="129" rx="7" ry="2.5" fill="#ffffff" opacity="0.65"/>
    </g>

    <!-- HEAD RIG (Secondary overlapping animation) -->
    <g class="head-rig">

      <!-- Ears with independent physics -->
      <g class="ear-left-rig">
        <circle cx="98" cy="84" r="20" fill="url(#furGrad)" stroke="#ecaab9" stroke-width="2.5"/>
        <circle cx="98" cy="84" r="11" fill="url(#innerEarGrad)"/>
        <ellipse cx="96" cy="80" rx="5" ry="2.5" fill="#ffffff" opacity="0.75"/>
        <!-- Ear Top Specular Crescent -->
        <path d="M 85 75 C 91 67 106 67 113 74 C 107 70 93 70 85 75 Z" fill="url(#specularRim)" opacity="0.9"/>
      </g>

      <g class="ear-right-rig">
        <circle cx="182" cy="84" r="20" fill="url(#furGrad)" stroke="#ecaab9" stroke-width="2.5"/>
        <circle cx="182" cy="84" r="11" fill="url(#innerEarGrad)"/>
        <ellipse cx="180" cy="80" rx="5" ry="2.5" fill="#ffffff" opacity="0.75"/>
        <!-- Ear Top Specular Crescent -->
        <path d="M 169 75 C 175 67 190 67 197 74 C 191 70 177 70 169 75 Z" fill="url(#specularRim)" opacity="0.9"/>
      </g>

      <!-- Head Base -->
      <circle cx="140" cy="116" r="50" fill="url(#furGrad)" stroke="#ecaab9" stroke-width="2.5"/>
      <!-- Glassy Head Highlight -->
      <ellipse cx="140" cy="90" rx="30" ry="12" fill="url(#glassReflection)" opacity="0.8"/>
      <!-- Head Top-Left Specular Rim Light Crescent -->
      <path d="M 98 96 C 108 75 138 70 162 75 C 145 77 121 82 109 98 C 103 106 99 116 97 125 C 95 114 96 104 98 96 Z" fill="url(#specularRim)" opacity="0.85"/>

      <!-- Party Hat -->
      <polygon points="140,42 116,82 164,82" fill="url(#goldGrad)"/>
      <polygon points="140,42 126,64 154,64" fill="#ff4d6d"/>
      <!-- Hat Glass Specular -->
      <polygon points="140,42 136,49 130,82 140,82" fill="#ffffff" opacity="0.3"/>

      <ellipse cx="140" cy="82" rx="26" ry="6" fill="#06d6a0"/>
      <circle cx="140" cy="40" r="9" fill="#06d6a0"/>
      <circle cx="138" cy="38" r="4" fill="#ffffff" opacity="0.9"/>

      <!-- Joyful Eyes with Specular Glints -->
      <path d="M 115 110 Q 124 102 133 110" fill="none" stroke="#2d131b" stroke-width="4" stroke-linecap="round"/>
      <path d="M 147 110 Q 156 102 165 110" fill="none" stroke="#2d131b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="124" cy="104" r="1.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="156" cy="104" r="1.5" fill="#ffffff" opacity="0.9"/>

      <!-- Blushing Cheeks -->
      <circle cx="110" cy="122" r="15" fill="url(#blushGrad)"/>
      <circle cx="170" cy="122" r="15" fill="url(#blushGrad)"/>
      <circle cx="108" cy="119" r="3" fill="#ffffff" opacity="0.85"/>
      <circle cx="112" cy="121" r="1.2" fill="#ffffff" opacity="0.7"/>
      <circle cx="172" cy="119" r="3" fill="#ffffff" opacity="0.85"/>
      <circle cx="168" cy="121" r="1.2" fill="#ffffff" opacity="0.7"/>

      <!-- Snout &amp; Nose with Specular Highlight -->
      <ellipse cx="140" cy="122" rx="15" ry="11" fill="#ffffff" stroke="#fce4ec" stroke-width="2"/>
      <ellipse cx="140" cy="117" rx="6" ry="4" fill="#441a28"/>
      <ellipse cx="138" cy="115.5" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.95"/>
      <circle cx="141.5" cy="116.2" r="0.7" fill="#ffffff" opacity="0.75"/>

      <!-- Mouth &amp; Tongue with High-Gloss Sheen -->
      <path d="M 128 124 Q 140 140 152 124 Z" fill="#a0133b" stroke="#441a28" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 132 130 Q 140 140 148 130 Z" fill="#ff7597"/>
      <ellipse cx="140" cy="132" rx="3.5" ry="1.5" fill="#ffffff" opacity="0.6"/>

    </g>
  </g>
</svg>