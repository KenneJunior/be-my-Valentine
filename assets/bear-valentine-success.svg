<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fff5f8"/>
      <stop offset="100%" stop-color="#fee5ed"/>
    </linearGradient>

    <radialGradient id="bellyGrad" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#ffdbe6"/>
    </radialGradient>

    <linearGradient id="innerEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff7597"/>
    </linearGradient>

    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2e63" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff5c8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffccd5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rubyHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff477e"/>
      <stop offset="40%" stop-color="#ff0a54"/>
      <stop offset="100%" stop-color="#a4133c"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe478"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>

    <filter id="premiumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#ff2e63" flood-opacity="0.25"/>
    </filter>

    <style>
      @keyframes victoryJump {
        0%, 100% { transform: translateY(0px) rotate(0deg) scale(1, 1); }
        25% { transform: translateY(-32px) rotate(-4deg) scale(0.96, 1.05); }
        50% { transform: translateY(6px) rotate(0deg) scale(1.08, 0.92); }
        75% { transform: translateY(-30px) rotate(4deg) scale(0.96, 1.05); }
      }

      @keyframes groundShadow {
        0%, 100% { transform: scale(1, 1); opacity: 0.35; }
        25%, 75% { transform: scale(0.68, 0.6); opacity: 0.14; }
        50% { transform: scale(1.22, 1.15); opacity: 0.48; }
      }

      @keyframes heartTwinkle {
        0%, 100% { transform: scale(0.9) rotate(-6deg); }
        50% { transform: scale(1.2) rotate(8deg); }
      }

      @keyframes petalDrift {
        0% { transform: translateY(-10px) translateX(0) rotate(0deg); opacity: 0; }
        30% { opacity: 0.9; }
        80% { opacity: 0.85; }
        100% { transform: translateY(210px) translateX(-18px) rotate(180deg); opacity: 0; }
      }

      @keyframes armWaveLeft {
        0%, 100% { transform: rotate(-35deg); }
        50% { transform: rotate(-48deg); }
      }

      @keyframes armWaveRight {
        0%, 100% { transform: rotate(35deg); }
        50% { transform: rotate(48deg); }
      }

      .bear-victory-rig {
        animation: victoryJump 1.05s cubic-bezier(0.28, 0.84, 0.38, 1) infinite;
        transform-origin: 140px 210px;
      }
      .ground-shadow-anim {
        animation: groundShadow 1.05s cubic-bezier(0.28, 0.84, 0.38, 1) infinite;
        transform-origin: 140px 218px;
      }
      .top-heart-anim {
        animation: heartTwinkle 1.4s ease-in-out infinite;
        transform-origin: 140px 32px;
      }
      .petal-1 { animation: petalDrift 3.4s linear infinite; }
      .petal-2 { animation: petalDrift 4.2s linear infinite 1.4s; }
      .arm-left {
        animation: armWaveLeft 1.05s ease-in-out infinite;
        transform-origin: 104px 145px;
      }
      .arm-right {
        animation: armWaveRight 1.05s ease-in-out infinite;
        transform-origin: 176px 145px;
      }
    </style>
  </defs>

  <!-- Drifting Rose Petals in Background -->
  <g fill="#ff4d6d">
    <path d="M 46,-5 C 40,-1 36,8 46,14 C 54,8 50,-1 46,-5 Z" class="petal-1"/>
    <path d="M 234,-8 C 228,-4 224,5 234,11 C 242,5 238,-4 234,-8 Z" class="petal-2"/>
  </g>

  <!-- Big Glowing Double Heart on Top -->
  <g class="top-heart-anim">
    <path d="M 140,24 C 134,10 114,14 114,30 C 114,46 140,58 140,58 C 140,58 166,46 166,30 C 166,14 146,10 140,24 Z" fill="url(#rubyHeart)"/>
    <ellipse cx="124" cy="24" rx="4.5" ry="2.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 124 24)"/>
  </g>
  <polygon points="45,40 47,44 51,45 48,48 49,52 45,50 41,52 42,48 39,45 43,44" fill="url(#goldGrad)"/>
  <polygon points="235,46 237,50 241,51 238,54 239,58 235,56 231,58 232,54 229,51 233,50" fill="url(#goldGrad)"/>

  <!-- Ground Shadow -->
  <ellipse cx="140" cy="218" rx="55" ry="11" fill="#e86b8b" class="ground-shadow-anim"/>

  <!-- Main Jumping Victory Bear -->
  <g class="bear-victory-rig" filter="url(#premiumGlow)">

    <!-- Feet -->
    <g id="feet">
      <ellipse cx="114" cy="204" rx="17" ry="13" fill="url(#furGrad)" stroke="#f5c2ce" stroke-width="2"/>
      <ellipse cx="114" cy="205" rx="8" ry="6" fill="url(#innerEarGrad)"/>
      <circle cx="109" cy="198" r="2" fill="#ff7597"/>
      <circle cx="114" cy="196" r="2" fill="#ff7597"/>
      <circle cx="119" cy="198" r="2" fill="#ff7597"/>

      <ellipse cx="166" cy="204" rx="17" ry="13" fill="url(#furGrad)" stroke="#f5c2ce" stroke-width="2"/>
      <ellipse cx="166" cy="205" rx="8" ry="6" fill="url(#innerEarGrad)"/>
      <circle cx="161" cy="198" r="2" fill="#ff7597"/>
      <circle cx="166" cy="196" r="2" fill="#ff7597"/>
      <circle cx="171" cy="198" r="2" fill="#ff7597"/>
    </g>

    <!-- Body -->
    <ellipse cx="140" cy="166" rx="46" ry="40" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <ellipse cx="140" cy="170" rx="30" ry="25" fill="url(#bellyGrad)"/>

    <!-- Arms UP with Joy -->
    <g class="arm-left">
      <ellipse cx="90" cy="132" rx="14" ry="9.5" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.2"/>
      <circle cx="86" cy="132" r="4.5" fill="url(#innerEarGrad)"/>
    </g>
    <g class="arm-right">
      <ellipse cx="190" cy="132" rx="14" ry="9.5" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.2"/>
      <circle cx="194" cy="132" r="4.5" fill="url(#innerEarGrad)"/>
    </g>

    <!-- Ears -->
    <circle cx="98" cy="84" r="20" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <circle cx="98" cy="84" r="11" fill="url(#innerEarGrad)"/>
    <ellipse cx="96" cy="80" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>

    <circle cx="182" cy="84" r="20" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <circle cx="182" cy="84" r="11" fill="url(#innerEarGrad)"/>
    <ellipse cx="180" cy="80" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>

    <!-- Head -->
    <circle cx="140" cy="116" r="48" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <ellipse cx="140" cy="95" rx="28" ry="14" fill="#ffffff" opacity="0.45"/>

    <!-- Joyful Eyes -->
    <path d="M 116 112 Q 124 104 132 112" fill="none" stroke="#2d131b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 148 112 Q 156 104 164 112" fill="none" stroke="#2d131b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Cheeks -->
    <circle cx="110" cy="122" r="14" fill="url(#blushGrad)"/>
    <circle cx="170" cy="122" r="14" fill="url(#blushGrad)"/>
    <circle cx="108" cy="119" r="2.5" fill="#ffffff" opacity="0.75"/>
    <circle cx="172" cy="119" r="2.5" fill="#ffffff" opacity="0.75"/>

    <!-- Snout & Nose -->
    <ellipse cx="140" cy="122" rx="14" ry="10" fill="#ffffff" stroke="#fce4ec" stroke-width="1.5"/>
    <ellipse cx="140" cy="118" rx="5.5" ry="3.8" fill="#441a28"/>

    <!-- Ecstatic Open Valentine Smile -->
    <path d="M 130 124 Q 140 138 150 124 Z" fill="#ff0a54" stroke="#441a28" stroke-width="2"/>
    <path d="M 134 130 Q 140 138 146 130 Z" fill="#ff758f"/>

  </g>
</svg>
