<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <style>
      @keyframes jump {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        30% { transform: translateY(-24px) scale(0.96, 1.04); }
        55% { transform: translateY(4px) scale(1.06, 0.94); }
        70% { transform: translateY(-8px) scale(0.98, 1.02); }
      }
      @keyframes firework {
        0% { transform: scale(0.6) rotate(0deg); opacity: 0.3; }
        50% { transform: scale(1.2) rotate(25deg); opacity: 1; }
        100% { transform: scale(0.6) rotate(50deg); opacity: 0.3; }
      }
      .bear-group {
        animation: jump 1.1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        transform-origin: 120px 170px;
      }
      .firework-1 { animation: firework 1.8s ease-in-out infinite; transform-origin: 45px 50px; }
      .firework-2 { animation: firework 2.1s ease-in-out infinite 0.7s; transform-origin: 195px 45px; }
    </style>
  </defs>

  <!-- Fireworks Background Sparkles -->
  <g class="firework-1">
    <circle cx="45" cy="50" r="3" fill="#ffd166"/>
    <line x1="45" y1="40" x2="45" y2="44" stroke="#ffd166" stroke-width="2"/>
    <line x1="45" y1="56" x2="45" y2="60" stroke="#ffd166" stroke-width="2"/>
    <line x1="35" y1="50" x2="39" y2="50" stroke="#ffd166" stroke-width="2"/>
    <line x1="51" y1="50" x2="55" y2="50" stroke="#ffd166" stroke-width="2"/>
  </g>
  <g class="firework-2">
    <circle cx="195" cy="45" r="3" fill="#00f5d4"/>
    <line x1="195" y1="36" x2="195" y2="40" stroke="#00f5d4" stroke-width="2"/>
    <line x1="195" y1="50" x2="195" y2="54" stroke="#00f5d4" stroke-width="2"/>
    <line x1="186" y1="45" x2="190" y2="45" stroke="#00f5d4" stroke-width="2"/>
    <line x1="200" y1="45" x2="204" y2="45" stroke="#00f5d4" stroke-width="2"/>
  </g>

  <!-- Jumping New Year Bear -->
  <g class="bear-group">
    <ellipse cx="120" cy="174" rx="42" ry="8" fill="#a078b4" opacity="0.3"/>

    <!-- Feet -->
    <ellipse cx="102" cy="168" rx="14" ry="11" fill="#ffffff" stroke="#c0b0d8" stroke-width="2"/>
    <circle cx="102" cy="169" r="6" fill="#f0c0db"/>
    <ellipse cx="138" cy="168" rx="14" ry="11" fill="#ffffff" stroke="#c0b0d8" stroke-width="2"/>
    <circle cx="138" cy="169" r="6" fill="#f0c0db"/>

    <!-- Bear Body -->
    <ellipse cx="120" cy="138" rx="38" ry="34" fill="#ffffff" stroke="#c0b0d8" stroke-width="2.5"/>
    <ellipse cx="120" cy="142" rx="23" ry="20" fill="#fcf6ff"/>

    <!-- Shiny Golden Bowtie -->
    <polygon points="113,124 113,136 120,130" fill="#ffd166"/>
    <polygon points="127,124 127,136 120,130" fill="#ffd166"/>
    <circle cx="120" cy="130" r="3.5" fill="#ffb703"/>

    <!-- Ears -->
    <circle cx="88" cy="74" r="16" fill="#ffffff" stroke="#c0b0d8" stroke-width="2.5"/>
    <circle cx="88" cy="74" r="9" fill="#fec5d4"/>
    <circle cx="152" cy="74" r="16" fill="#ffffff" stroke="#c0b0d8" stroke-width="2.5"/>
    <circle cx="152" cy="74" r="9" fill="#fec5d4"/>

    <!-- Head -->
    <circle cx="120" cy="98" r="38" fill="#ffffff" stroke="#c0b0d8" stroke-width="2.5"/>

    <!-- 2026 Glitter Party Hat -->
    <polygon points="120,38 102,70 138,70" fill="#7209b7"/>
    <polygon points="120,38 112,56 128,56" fill="#ffd166"/>
    <!-- Gold Trim -->
    <ellipse cx="120" cy="70" rx="19" ry="4" fill="#ffd166"/>
    <!-- Star Pom-Pom -->
    <polygon points="120,32 122,36 126,37 123,40 124,44 120,42 116,44 117,40 114,37 118,36" fill="#ffd166"/>
    <!-- '2026' Text on Hat -->
    <text x="120" y="65" font-family="'Outfit', sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">2026</text>

    <!-- Eyes (Joyful arches) -->
    <path d="M 103 96 Q 109 90 113 96" fill="none" stroke="#2b1842" stroke-width="3" stroke-linecap="round"/>
    <path d="M 127 96 Q 131 90 137 96" fill="none" stroke="#2b1842" stroke-width="3" stroke-linecap="round"/>

    <!-- Blushing Cheeks -->
    <ellipse cx="98" cy="106" rx="7.5" ry="4.5" fill="#f72585" opacity="0.75"/>
    <ellipse cx="142" cy="106" rx="7.5" ry="4.5" fill="#f72585" opacity="0.75"/>

    <!-- Snout & Nose -->
    <ellipse cx="120" cy="105" rx="11" ry="8" fill="#fcf6ff"/>
    <ellipse cx="120" cy="102" rx="4.5" ry="3" fill="#4a2840"/>
    <path d="M 120 105 Q 116 111 112 108" fill="none" stroke="#4a2840" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 120 105 Q 124 111 128 108" fill="none" stroke="#4a2840" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Left Paw -->
    <ellipse cx="96" cy="136" rx="10" ry="8" fill="#ffffff" stroke="#c0b0d8" stroke-width="2"/>

    <!-- Right Paw holding Party Horn with stars -->
    <polygon points="144,136 166,124 168,132" fill="#ffd166"/>
    <polygon points="166,124 172,120 174,136 168,132" fill="#f72585"/>
    <circle cx="178" cy="122" r="2.5" fill="#ffd166"/>
    <circle cx="184" cy="128" r="2" fill="#00f5d4"/>
    <ellipse cx="144" cy="136" rx="10" ry="8" fill="#ffffff" stroke="#c0b0d8" stroke-width="2"/>
  </g>
</svg>
