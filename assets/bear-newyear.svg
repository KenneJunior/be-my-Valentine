<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fdfafd"/>
      <stop offset="100%" stop-color="#f5ecf8"/>
    </linearGradient>

    <radialGradient id="bellyGrad" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#faf2fc"/>
      <stop offset="100%" stop-color="#ebd8f2"/>
    </radialGradient>

    <linearGradient id="innerEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7aef8"/>
      <stop offset="100%" stop-color="#d05ce3"/>
    </linearGradient>

    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f72585" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#b5179e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f2c6f0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209b7"/>
      <stop offset="50%" stop-color="#560bad"/>
      <stop offset="100%" stop-color="#3a0ca3"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe478"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>

    <linearGradient id="specularRim" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="irisLight" cx="50%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#b5179e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#7209b7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22112d" stop-opacity="0"/>
    </radialGradient>

    <filter id="premiumGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#7209b7" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f72585" flood-opacity="0.18"/>
    </filter>

    <style>
      /* Physically grounded spring-damper squash and stretch jump */
      @keyframes bearSpringJump {
        0% { transform: translateY(0px) scale(1, 1) rotate(0deg); }
        9% { transform: translateY(11px) scale(1.15, 0.85) rotate(0deg); }
        22% { transform: translateY(-16px) scale(0.88, 1.15) rotate(1deg); }
        36% { transform: translateY(-44px) scale(0.93, 1.09) rotate(2deg); }
        48% { transform: translateY(-47px) scale(1.02, 0.98) rotate(0.6deg); }
        64% { transform: translateY(-12px) scale(0.89, 1.14) rotate(-0.8deg); }
        74% { transform: translateY(13px) scale(1.24, 0.76) rotate(0deg); }
        84% { transform: translateY(-10px) scale(0.93, 1.08) rotate(-0.5deg); }
        92% { transform: translateY(3px) scale(1.04, 0.97) rotate(0.2deg); }
        100% { transform: translateY(0px) scale(1, 1) rotate(0deg); }
      }

      @keyframes groundShadowSpring {
        0% { transform: scale(1, 1); opacity: 0.38; }
        9% { transform: scale(1.28, 1.22); opacity: 0.55; }
        22% { transform: scale(0.74, 0.68); opacity: 0.20; }
        36%, 48% { transform: scale(0.44, 0.40); opacity: 0.08; }
        64% { transform: scale(0.80, 0.74); opacity: 0.22; }
        74% { transform: scale(1.36, 1.30); opacity: 0.65; }
        84% { transform: scale(0.86, 0.82); opacity: 0.26; }
        92% { transform: scale(1.07, 1.05); opacity: 0.44; }
        100% { transform: scale(1, 1); opacity: 0.38; }
      }

      @keyframes earLeftSpring {
        0% { transform: rotate(0deg) scale(1); }
        9% { transform: rotate(8deg) scale(1.05, 0.95); }
        22% { transform: rotate(-14deg) scale(0.94, 1.08); }
        36% { transform: rotate(12deg) scale(1.03, 0.97); }
        48% { transform: rotate(5deg) scale(1, 1); }
        64% { transform: rotate(-12deg) scale(0.95, 1.06); }
        74% { transform: rotate(18deg) scale(1.12, 0.86); }
        84% { transform: rotate(-8deg) scale(0.95, 1.06); }
        92% { transform: rotate(3deg) scale(1.02, 0.98); }
        100% { transform: rotate(0deg) scale(1); }
      }

      @keyframes earRightSpring {
        0% { transform: rotate(0deg) scale(1); }
        9% { transform: rotate(-8deg) scale(1.05, 0.95); }
        22% { transform: rotate(14deg) scale(0.94, 1.08); }
        36% { transform: rotate(-12deg) scale(1.03, 0.97); }
        48% { transform: rotate(-5deg) scale(1, 1); }
        64% { transform: rotate(12deg) scale(0.95, 1.06); }
        74% { transform: rotate(-18deg) scale(1.12, 0.86); }
        84% { transform: rotate(8deg) scale(0.95, 1.06); }
        92% { transform: rotate(-3deg) scale(1.02, 0.98); }
        100% { transform: rotate(0deg) scale(1); }
      }

      @keyframes starBobbleSpring {
        0%, 100% { transform: rotate(-8deg) scale(0.95); }
        50% { transform: rotate(10deg) scale(1.15); filter: drop-shadow(0 0 8px rgba(255, 214, 102, 0.8)); }
      }

      @keyframes fireworkBurst {
        0% { transform: scale(0.6) rotate(0deg); opacity: 0.3; }
        50% { transform: scale(1.25) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 10px rgba(255, 214, 102, 0.8)); }
        100% { transform: scale(0.6) rotate(90deg); opacity: 0.3; }
      }

      @keyframes eyeBlink {
        0%, 93%, 97%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.08); }
      }

      .bear-jumping-rig {
        animation: bearSpringJump 1.25s cubic-bezier(0.28, 0.84, 0.36, 1) infinite;
        transform-origin: 140px 210px;
      }
      .ground-shadow-anim {
        animation: groundShadowSpring 1.25s cubic-bezier(0.28, 0.84, 0.36, 1) infinite;
        transform-origin: 140px 218px;
      }
      .ear-l-anim {
        animation: earLeftSpring 1.25s cubic-bezier(0.3, 0.8, 0.4, 1) infinite;
        transform-origin: 98px 84px;
      }
      .ear-r-anim {
        animation: earRightSpring 1.25s cubic-bezier(0.3, 0.8, 0.4, 1) infinite;
        transform-origin: 182px 84px;
      }
      .star-topper-anim {
        animation: starBobbleSpring 1.25s ease-in-out infinite;
        transform-origin: 140px 42px;
      }
      .firework-1 { animation: fireworkBurst 2s ease-in-out infinite; transform-origin: 46px 50px; }
      .firework-2 { animation: fireworkBurst 2.3s ease-in-out infinite 0.7s; transform-origin: 236px 55px; }
      .eye-blink-anim {
        animation: eyeBlink 3.7s ease-in-out infinite;
        transform-origin: 140px 115px;
      }
    </style>
  </defs>

  <!-- Festive New Year Fireworks in Background -->
  <g class="firework-1">
    <circle cx="46" cy="50" r="3.5" fill="url(#goldGrad)"/>
    <line x1="46" y1="36" x2="46" y2="42" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="58" x2="46" y2="64" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="50" x2="38" y2="50" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="54" y1="50" x2="60" y2="50" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g class="firework-2">
    <circle cx="236" cy="55" r="3.5" fill="#00f5d4"/>
    <line x1="236" y1="42" x2="236" y2="47" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>
    <line x1="236" y1="63" x2="236" y2="68" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>
    <line x1="223" y1="55" x2="228" y2="55" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>
    <line x1="244" y1="55" x2="249" y2="55" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="140" cy="218" rx="55" ry="11" fill="#9d68b8" class="ground-shadow-anim"/>

  <!-- Jumping Bear Rig -->
  <g class="bear-jumping-rig" filter="url(#premiumGlow)">

    <!-- Feet with Soft Lilac Pads -->
    <g id="feet">
      <ellipse cx="114" cy="204" rx="17" ry="13" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2"/>
      <ellipse cx="114" cy="205" rx="8" ry="6" fill="url(#innerEarGrad)"/>
      <circle cx="109" cy="198" r="2" fill="#d05ce3"/>
      <circle cx="114" cy="196" r="2" fill="#d05ce3"/>
      <circle cx="119" cy="198" r="2" fill="#d05ce3"/>

      <ellipse cx="166" cy="204" rx="17" ry="13" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2"/>
      <ellipse cx="166" cy="205" rx="8" ry="6" fill="url(#innerEarGrad)"/>
      <circle cx="161" cy="198" r="2" fill="#d05ce3"/>
      <circle cx="166" cy="196" r="2" fill="#d05ce3"/>
      <circle cx="171" cy="198" r="2" fill="#d05ce3"/>
    </g>

    <!-- Body -->
    <ellipse cx="140" cy="166" rx="46" ry="40" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2.5"/>
    <!-- Body Left Rim Specular Lighting -->
    <path d="M 99 150 C 95 160 97 175 106 188 C 103 176 102 163 105 152 Z" fill="url(#specularRim)" opacity="0.75"/>
    <ellipse cx="140" cy="170" rx="30" ry="25" fill="url(#bellyGrad)"/>
    <!-- Belly Top Specular Gloss Arc -->
    <ellipse cx="140" cy="153" rx="18" ry="4.5" fill="#ffffff" opacity="0.6"/>

    <!-- Shiny Golden Bowtie with Specular Highlight -->
    <g transform="translate(140, 152)">
      <polygon points="-16,-7 -16,7 0,0" fill="url(#goldGrad)"/>
      <polygon points="16,-7 16,7 0,0" fill="url(#goldGrad)"/>
      <!-- Bowtie Left &amp; Right Facet Sheen -->
      <polygon points="-14,-6 -8,0 -14,0" fill="#ffffff" opacity="0.5"/>
      <polygon points="14,-6 8,0 14,0" fill="#ffffff" opacity="0.5"/>
      <circle cx="0" cy="0" r="4.5" fill="#ffd166"/>
      <circle cx="-1" cy="-1.2" r="1.6" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Left Ear with Animated Recoil -->
    <g class="ear-l-anim">
      <circle cx="98" cy="84" r="20" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2.5"/>
      <circle cx="98" cy="84" r="11" fill="url(#innerEarGrad)"/>
      <ellipse cx="96" cy="80" rx="5" ry="2.5" fill="#ffffff" opacity="0.7"/>
      <!-- Ear Top Specular Crescent -->
      <path d="M 85 75 C 91 67 106 67 113 74 C 107 70 93 70 85 75 Z" fill="url(#specularRim)" opacity="0.9"/>
    </g>

    <!-- Right Ear with Animated Recoil -->
    <g class="ear-r-anim">
      <circle cx="182" cy="84" r="20" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2.5"/>
      <circle cx="182" cy="84" r="11" fill="url(#innerEarGrad)"/>
      <ellipse cx="180" cy="80" rx="5" ry="2.5" fill="#ffffff" opacity="0.7"/>
      <!-- Ear Top Specular Crescent -->
      <path d="M 169 75 C 175 67 190 67 197 74 C 191 70 177 70 169 75 Z" fill="url(#specularRim)" opacity="0.9"/>
    </g>

    <!-- Head -->
    <circle cx="140" cy="116" r="48" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2.5"/>
    <ellipse cx="140" cy="95" rx="28" ry="14" fill="#ffffff" opacity="0.45"/>
    <!-- Head Top-Left Specular Rim Light Crescent -->
    <path d="M 100 96 C 110 76 138 71 162 76 C 145 78 122 83 110 99 C 104 107 100 117 98 126 C 96 115 97 104 100 96 Z" fill="url(#specularRim)" opacity="0.85"/>

    <!-- 2026 Glitter Party Hat with Specular Rim &amp; Star Bobble -->
    <g>
      <polygon points="140,40 116,80 164,80" fill="url(#hatGrad)"/>
      <!-- Hat Left Facet Specular Highlight -->
      <polygon points="140,40 120,78 132,78" fill="#ffffff" opacity="0.2"/>
      <polygon points="140,40 128,62 152,62" fill="url(#goldGrad)"/>
      <ellipse cx="140" cy="80" rx="25" ry="5" fill="url(#goldGrad)"/>
      <ellipse cx="140" cy="78.5" rx="22" ry="2.5" fill="#ffffff" opacity="0.45"/>
      <!-- Golden Star Topper with Spring Bobble -->
      <g class="star-topper-anim">
        <polygon points="140,32 142,37 148,38 144,42 145,47 140,44 135,47 136,42 132,38 138,37" fill="url(#goldGrad)"/>
        <circle cx="140" cy="40" r="1.8" fill="#ffffff" opacity="0.85"/>
      </g>
      <!-- '2026' text with subtle drop shadow -->
      <text x="140" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">2026</text>
    </g>

    <!-- Eyes (Anime Glossy with Subsurface Iris Rim and Specular Glints) -->
    <g class="eye-blink-anim">
      <g transform="translate(118, 114)">
        <ellipse cx="0" cy="0" rx="6.8" ry="8.8" fill="#1b0c26"/>
        <ellipse cx="0" cy="3" rx="5" ry="3.5" fill="url(#irisLight)"/>
        <ellipse cx="-2.3" cy="-3.2" rx="3" ry="3.8" fill="#ffffff"/>
        <circle cx="2.6" cy="3.2" r="1.4" fill="#ffffff"/>
        <circle cx="-3" cy="1.5" r="0.8" fill="#ffffff" opacity="0.8"/>
        <path d="M -4.5 3.5 Q 0 7.5 4.5 3.5" stroke="#f7aef8" stroke-width="1.2" fill="none" opacity="0.85"/>
      </g>
      <g transform="translate(162, 114)">
        <ellipse cx="0" cy="0" rx="6.8" ry="8.8" fill="#1b0c26"/>
        <ellipse cx="0" cy="3" rx="5" ry="3.5" fill="url(#irisLight)"/>
        <ellipse cx="-2.3" cy="-3.2" rx="3" ry="3.8" fill="#ffffff"/>
        <circle cx="2.6" cy="3.2" r="1.4" fill="#ffffff"/>
        <circle cx="-3" cy="1.5" r="0.8" fill="#ffffff" opacity="0.8"/>
        <path d="M -4.5 3.5 Q 0 7.5 4.5 3.5" stroke="#f7aef8" stroke-width="1.2" fill="none" opacity="0.85"/>
      </g>
    </g>

    <!-- Rosy Blushing Cheeks with Sparkles -->
    <circle cx="110" cy="126" r="13" fill="url(#blushGrad)"/>
    <circle cx="170" cy="126" r="13" fill="url(#blushGrad)"/>
    <ellipse cx="107" cy="123" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="111" cy="125" r="1" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="173" cy="123" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="169" cy="125" r="1" fill="#ffffff" opacity="0.6"/>

    <!-- Snout &amp; Truffle Nose with High-Gloss Specular Pill -->
    <ellipse cx="140" cy="126" rx="14" ry="10" fill="#ffffff" stroke="#f0e2f5" stroke-width="1.5"/>
    <ellipse cx="140" cy="122" rx="5.8" ry="3.8" fill="#2d1236"/>
    <ellipse cx="138" cy="120.6" rx="2.4" ry="1.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="141.5" cy="121.2" r="0.7" fill="#ffffff" opacity="0.75"/>
    <path d="M 140 125.5 Q 134 133 129 129" fill="none" stroke="#381b40" stroke-width="2" stroke-linecap="round"/>
    <path d="M 140 125.5 Q 146 133 151 129" fill="none" stroke="#381b40" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Paw with Specular Pad Sheen -->
    <ellipse cx="112" cy="164" rx="12" ry="10" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2"/>
    <ellipse cx="110" cy="161" rx="4.5" ry="2.2" fill="#ffffff" opacity="0.65"/>

    <!-- Right Paw holding Festive Party Horn with Stars &amp; Specular Streak -->
    <g transform="translate(156, 142) rotate(-15)">
      <polygon points="0,10 26,0 28,12 0,14" fill="url(#goldGrad)"/>
      <!-- Horn Specular Top Streak -->
      <line x1="2" y1="10" x2="25" y2="1.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
      <polygon points="26,0 34,-4 36,16 28,12" fill="#f72585"/>
      <circle cx="42" cy="-2" r="3" fill="url(#goldGrad)"/>
      <circle cx="48" cy="6" r="2.5" fill="#00f5d4"/>
    </g>
    <ellipse cx="168" cy="164" rx="12" ry="10" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2"/>
    <ellipse cx="166" cy="161" rx="4.5" ry="2.2" fill="#ffffff" opacity="0.65"/>

  </g>
</svg>
