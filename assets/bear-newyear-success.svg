<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fdfafd"/>
      <stop offset="100%" stop-color="#f5ecf8"/>
    </linearGradient>

    <radialGradient id="bellyGrad" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#faf2fc"/>
      <stop offset="100%" stop-color="#ebd8f2"/>
    </radialGradient>

    <linearGradient id="innerEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7aef8"/>
      <stop offset="100%" stop-color="#d05ce3"/>
    </linearGradient>

    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f72585" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#b5179e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f2c6f0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209b7"/>
      <stop offset="50%" stop-color="#560bad"/>
      <stop offset="100%" stop-color="#3a0ca3"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe478"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>

    <linearGradient id="specularRim" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="premiumGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7209b7" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#f72585" flood-opacity="0.2"/>
    </filter>

    <style>
      /* Physically grounded spring-damper squash and stretch jump */
      @keyframes victorySpringJump {
        0% { transform: translateY(0px) scale(1, 1) rotate(0deg); }
        9% { transform: translateY(12px) scale(1.16, 0.84) rotate(0deg); }
        22% { transform: translateY(-18px) scale(0.88, 1.16) rotate(1deg); }
        36% { transform: translateY(-46px) scale(0.92, 1.1) rotate(2deg); }
        48% { transform: translateY(-49px) scale(1.03, 0.97) rotate(0.6deg); }
        64% { transform: translateY(-14px) scale(0.89, 1.15) rotate(-0.8deg); }
        74% { transform: translateY(14px) scale(1.26, 0.74) rotate(0deg); }
        84% { transform: translateY(-11px) scale(0.93, 1.08) rotate(-0.5deg); }
        92% { transform: translateY(3px) scale(1.04, 0.97) rotate(0.2deg); }
        100% { transform: translateY(0px) scale(1, 1) rotate(0deg); }
      }

      @keyframes groundShadowSpring {
        0% { transform: scale(1, 1); opacity: 0.38; }
        9% { transform: scale(1.28, 1.22); opacity: 0.55; }
        22% { transform: scale(0.74, 0.68); opacity: 0.20; }
        36%, 48% { transform: scale(0.44, 0.40); opacity: 0.08; }
        64% { transform: scale(0.80, 0.74); opacity: 0.22; }
        74% { transform: scale(1.36, 1.30); opacity: 0.65; }
        84% { transform: scale(0.86, 0.82); opacity: 0.26; }
        92% { transform: scale(1.07, 1.05); opacity: 0.44; }
        100% { transform: scale(1, 1); opacity: 0.38; }
      }

      @keyframes earFlopLeftSpring {
        0% { transform: rotate(0deg) scale(1); }
        9% { transform: rotate(10deg) scale(1.05, 0.95); }
        22% { transform: rotate(-16deg) scale(0.93, 1.09); }
        36% { transform: rotate(14deg) scale(1.04, 0.96); }
        48% { transform: rotate(6deg) scale(1, 1); }
        64% { transform: rotate(-14deg) scale(0.94, 1.07); }
        74% { transform: rotate(20deg) scale(1.14, 0.85); }
        84% { transform: rotate(-9deg) scale(0.95, 1.06); }
        92% { transform: rotate(3deg) scale(1.02, 0.98); }
        100% { transform: rotate(0deg) scale(1); }
      }

      @keyframes earFlopRightSpring {
        0% { transform: rotate(0deg) scale(1); }
        9% { transform: rotate(-10deg) scale(1.05, 0.95); }
        22% { transform: rotate(16deg) scale(0.93, 1.09); }
        36% { transform: rotate(-14deg) scale(1.04, 0.96); }
        48% { transform: rotate(-6deg) scale(1, 1); }
        64% { transform: rotate(14deg) scale(0.94, 1.07); }
        74% { transform: rotate(-20deg) scale(1.14, 0.85); }
        84% { transform: rotate(9deg) scale(0.95, 1.06); }
        92% { transform: rotate(-3deg) scale(1.02, 0.98); }
        100% { transform: rotate(0deg) scale(1); }
      }

      @keyframes starBurst {
        0% { transform: scale(0.72) rotate(0deg); opacity: 0.4; filter: drop-shadow(0 0 4px rgba(255, 214, 102, 0.4)); }
        50% { transform: scale(1.32) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 14px rgba(255, 214, 102, 0.9)); }
        100% { transform: scale(0.72) rotate(90deg); opacity: 0.4; }
      }

      @keyframes armWaveLeft {
        0%, 100% { transform: rotate(-32deg); }
        22% { transform: rotate(-22deg); }
        48% { transform: rotate(-58deg); }
        74% { transform: rotate(-24deg); }
        84% { transform: rotate(-40deg); }
      }

      @keyframes armWaveRight {
        0%, 100% { transform: rotate(32deg); }
        22% { transform: rotate(22deg); }
        48% { transform: rotate(58deg); }
        74% { transform: rotate(24deg); }
        84% { transform: rotate(40deg); }
      }

      .bear-victory-rig {
        animation: victorySpringJump 1.15s cubic-bezier(0.28, 0.84, 0.36, 1) infinite;
        transform-origin: 140px 210px;
      }
      .ground-shadow-anim {
        animation: groundShadowSpring 1.15s cubic-bezier(0.28, 0.84, 0.36, 1) infinite;
        transform-origin: 140px 218px;
      }
      .ear-left-rig {
        animation: earFlopLeftSpring 1.15s cubic-bezier(0.3, 0.8, 0.4, 1) infinite;
        transform-origin: 98px 84px;
      }
      .ear-right-rig {
        animation: earFlopRightSpring 1.15s cubic-bezier(0.3, 0.8, 0.4, 1) infinite;
        transform-origin: 182px 84px;
      }
      .star-burst-anim {
        animation: starBurst 1.8s ease-in-out infinite;
        transform-origin: 140px 26px;
      }
      .arm-left {
        animation: armWaveLeft 1.15s ease-in-out infinite;
        transform-origin: 104px 145px;
      }
      .arm-right {
        animation: armWaveRight 1.15s ease-in-out infinite;
        transform-origin: 176px 145px;
      }
    </style>
  </defs>

  <!-- Luminous Starburst in Background -->
  <g class="star-burst-anim">
    <polygon points="140,12 143,23 155,25 146,33 148,45 140,39 132,45 134,33 125,25 137,23" fill="url(#goldGrad)"/>
    <circle cx="140" cy="28" r="3" fill="#ffffff"/>
  </g>
  <circle cx="45" cy="50" r="4" fill="#00f5d4"/>
  <circle cx="235" cy="55" r="4" fill="#f72585"/>

  <!-- Ground Shadow -->
  <ellipse cx="140" cy="218" rx="55" ry="11" fill="#9d68b8" class="ground-shadow-anim"/>

  <!-- Main Jumping Victory Bear -->
  <g class="bear-victory-rig" filter="url(#premiumGlow)">

    <!-- Feet -->
    <g id="feet">
      <ellipse cx="114" cy="204" rx="17" ry="13" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2"/>
      <ellipse cx="114" cy="205" rx="8" ry="6" fill="url(#innerEarGrad)"/>
      <circle cx="109" cy="198" r="2" fill="#d05ce3"/>
      <circle cx="114" cy="196" r="2" fill="#d05ce3"/>
      <circle cx="119" cy="198" r="2" fill="#d05ce3"/>

      <ellipse cx="166" cy="204" rx="17" ry="13" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2"/>
      <ellipse cx="166" cy="205" rx="8" ry="6" fill="url(#innerEarGrad)"/>
      <circle cx="161" cy="198" r="2" fill="#d05ce3"/>
      <circle cx="166" cy="196" r="2" fill="#d05ce3"/>
      <circle cx="171" cy="198" r="2" fill="#d05ce3"/>
    </g>

    <!-- Body -->
    <ellipse cx="140" cy="166" rx="46" ry="40" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2.5"/>
    <!-- Body Left Rim Specular Lighting -->
    <path d="M 99 150 C 95 160 97 175 106 188 C 103 176 102 163 105 152 Z" fill="url(#specularRim)" opacity="0.75"/>
    <ellipse cx="140" cy="170" rx="30" ry="25" fill="url(#bellyGrad)"/>
    <!-- Belly Top Specular Gloss Arc -->
    <ellipse cx="140" cy="153" rx="18" ry="4.5" fill="#ffffff" opacity="0.6"/>

    <!-- Shiny Bowtie with Specular Highlight -->
    <g transform="translate(140, 152)">
      <polygon points="-16,-7 -16,7 0,0" fill="url(#goldGrad)"/>
      <polygon points="16,-7 16,7 0,0" fill="url(#goldGrad)"/>
      <!-- Bowtie Facet Sheen -->
      <polygon points="-14,-6 -8,0 -14,0" fill="#ffffff" opacity="0.5"/>
      <polygon points="14,-6 8,0 14,0" fill="#ffffff" opacity="0.5"/>
      <circle cx="0" cy="0" r="4.5" fill="#ffd166"/>
      <circle cx="-1" cy="-1.2" r="1.6" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Arms UP cheering with Joy -->
    <g class="arm-left">
      <ellipse cx="90" cy="132" rx="14" ry="9.5" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2.2"/>
      <circle cx="86" cy="132" r="4.5" fill="url(#innerEarGrad)"/>
      <ellipse cx="91" cy="129" rx="6" ry="2.2" fill="#ffffff" opacity="0.65"/>
    </g>
    <g class="arm-right">
      <ellipse cx="190" cy="132" rx="14" ry="9.5" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2.2"/>
      <circle cx="194" cy="132" r="4.5" fill="url(#innerEarGrad)"/>
      <ellipse cx="189" cy="129" rx="6" ry="2.2" fill="#ffffff" opacity="0.65"/>
    </g>

    <!-- Ears with Dynamic Spring Recoil -->
    <g class="ear-left-rig">
      <circle cx="98" cy="84" r="20" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2.5"/>
      <circle cx="98" cy="84" r="11" fill="url(#innerEarGrad)"/>
      <ellipse cx="96" cy="80" rx="5" ry="2.5" fill="#ffffff" opacity="0.7"/>
      <!-- Ear Top Specular Crescent -->
      <path d="M 85 75 C 91 67 106 67 113 74 C 107 70 93 70 85 75 Z" fill="url(#specularRim)" opacity="0.9"/>
    </g>

    <g class="ear-right-rig">
      <circle cx="182" cy="84" r="20" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2.5"/>
      <circle cx="182" cy="84" r="11" fill="url(#innerEarGrad)"/>
      <ellipse cx="180" cy="80" rx="5" ry="2.5" fill="#ffffff" opacity="0.7"/>
      <!-- Ear Top Specular Crescent -->
      <path d="M 169 75 C 175 67 190 67 197 74 C 191 70 177 70 169 75 Z" fill="url(#specularRim)" opacity="0.9"/>
    </g>

    <!-- Head -->
    <circle cx="140" cy="116" r="48" fill="url(#furGrad)" stroke="#d9c2e6" stroke-width="2.5"/>
    <ellipse cx="140" cy="95" rx="28" ry="14" fill="#ffffff" opacity="0.45"/>
    <!-- Head Top-Left Specular Rim Light Crescent -->
    <path d="M 100 96 C 110 76 138 71 162 76 C 145 78 122 83 110 99 C 104 107 100 117 98 126 C 96 115 97 104 100 96 Z" fill="url(#specularRim)" opacity="0.85"/>

    <!-- 2026 Party Hat with Golden Star &amp; Specular Sheen -->
    <g>
      <polygon points="140,40 116,80 164,80" fill="url(#hatGrad)"/>
      <polygon points="140,40 120,78 132,78" fill="#ffffff" opacity="0.22"/>
      <polygon points="140,40 128,62 152,62" fill="url(#goldGrad)"/>
      <ellipse cx="140" cy="80" rx="25" ry="5" fill="url(#goldGrad)"/>
      <ellipse cx="140" cy="78.5" rx="22" ry="2.5" fill="#ffffff" opacity="0.45"/>
      <!-- Golden Star Topper -->
      <polygon points="140,32 142,37 148,38 144,42 145,47 140,44 135,47 136,42 132,38 138,37" fill="url(#goldGrad)"/>
      <circle cx="140" cy="40" r="1.8" fill="#ffffff" opacity="0.85"/>
      <text x="140" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">2026</text>
    </g>

    <!-- Happy Joyful Eyes with Twinkle Glints -->
    <path d="M 116 112 Q 124 104 132 112" fill="none" stroke="#22112d" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 148 112 Q 156 104 164 112" fill="none" stroke="#22112d" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="124" cy="106" r="1.4" fill="#ffffff" opacity="0.9"/>
    <circle cx="156" cy="106" r="1.4" fill="#ffffff" opacity="0.9"/>

    <!-- Cheeks with Rosy Sparkles -->
    <circle cx="110" cy="122" r="14" fill="url(#blushGrad)"/>
    <circle cx="170" cy="122" r="14" fill="url(#blushGrad)"/>
    <circle cx="108" cy="119" r="2.8" fill="#ffffff" opacity="0.85"/>
    <circle cx="112" cy="121" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="172" cy="119" r="2.8" fill="#ffffff" opacity="0.85"/>
    <circle cx="168" cy="121" r="1.2" fill="#ffffff" opacity="0.7"/>

    <!-- Snout &amp; Truffle Nose with High-Gloss Specular Pill -->
    <ellipse cx="140" cy="122" rx="14" ry="10" fill="#ffffff" stroke="#f0e2f5" stroke-width="1.5"/>
    <ellipse cx="140" cy="118" rx="5.8" ry="3.8" fill="#2d1236"/>
    <ellipse cx="138" cy="116.5" rx="2.4" ry="1.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="141.5" cy="117.2" r="0.7" fill="#ffffff" opacity="0.75"/>

    <!-- Big Open Happy Smile with Gloss Tongue Sheen -->
    <path d="M 130 124 Q 140 138 150 124 Z" fill="#f72585" stroke="#381b40" stroke-width="2"/>
    <path d="M 134 130 Q 140 138 146 130 Z" fill="#ff70a6"/>
    <ellipse cx="140" cy="132" rx="3.5" ry="1.5" fill="#ffffff" opacity="0.65"/>

  </g>
</svg>
