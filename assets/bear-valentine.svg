<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fff5f8"/>
      <stop offset="100%" stop-color="#fee5ed"/>
    </linearGradient>

    <radialGradient id="bellyGrad" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#ffdbe6"/>
    </radialGradient>

    <linearGradient id="innerEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff7597"/>
    </linearGradient>

    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2e63" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff5c8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffccd5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rubyHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff477e"/>
      <stop offset="40%" stop-color="#ff0a54"/>
      <stop offset="100%" stop-color="#a4133c"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#ff2e63"/>
    </linearGradient>

    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff758f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="premiumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#ff2e63" flood-opacity="0.25"/>
    </filter>

    <style>
      @keyframes bearJump {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        25% { transform: translateY(-28px) scale(0.97, 1.05); }
        50% { transform: translateY(-34px) scale(0.96, 1.06) rotate(1.5deg); }
        75% { transform: translateY(6px) scale(1.08, 0.92) rotate(-0.5deg); }
        88% { transform: translateY(-6px) scale(0.99, 1.01); }
      }

      @keyframes groundShadow {
        0%, 100% { transform: scale(1, 1); opacity: 0.35; }
        25%, 50% { transform: scale(0.72, 0.65); opacity: 0.16; }
        75% { transform: scale(1.2, 1.15); opacity: 0.48; }
      }

      @keyframes heartBeat {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255, 46, 99, 0.4)); }
        20% { transform: scale(1.18); filter: drop-shadow(0 0 14px rgba(255, 46, 99, 0.8)); }
        40% { transform: scale(1.05); filter: drop-shadow(0 0 8px rgba(255, 46, 99, 0.5)); }
        60% { transform: scale(1.15); filter: drop-shadow(0 0 12px rgba(255, 46, 99, 0.7)); }
        80% { transform: scale(1); }
      }

      @keyframes heartFloatUp1 {
        0% { transform: translateY(0) translateX(0) scale(0.75); opacity: 0; }
        25% { opacity: 0.9; }
        75% { opacity: 0.85; }
        100% { transform: translateY(-45px) translateX(-10px) scale(1.1); opacity: 0; }
      }

      @keyframes heartFloatUp2 {
        0% { transform: translateY(0) translateX(0) scale(0.7); opacity: 0; }
        30% { opacity: 0.9; }
        80% { opacity: 0.8; }
        100% { transform: translateY(-50px) translateX(12px) scale(1.15); opacity: 0; }
      }

      @keyframes eyeBlink {
        0%, 93%, 97%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.08); }
      }

      .bear-jumping-rig {
        animation: bearJump 1.25s cubic-bezier(0.3, 0.8, 0.4, 1) infinite;
        transform-origin: 140px 210px;
      }
      .ground-shadow-anim {
        animation: groundShadow 1.25s cubic-bezier(0.3, 0.8, 0.4, 1) infinite;
        transform-origin: 140px 218px;
      }
      .heart-beat-anim {
        animation: heartBeat 1.25s ease-in-out infinite;
        transform-origin: 140px 170px;
      }
      .float-heart-1 { animation: heartFloatUp1 2.6s ease-out infinite; transform-origin: 48px 75px; }
      .float-heart-2 { animation: heartFloatUp2 3s ease-out infinite 1.2s; transform-origin: 232px 70px; }
      .eye-blink-anim {
        animation: eyeBlink 3.6s ease-in-out infinite;
        transform-origin: 140px 115px;
      }
    </style>
  </defs>

  <!-- Floating Tender Valentine Hearts -->
  <g class="float-heart-1">
    <path d="M 48,70 C 44,63 32,65 32,77 C 32,87 48,97 48,97 C 48,97 64,87 64,77 C 64,65 52,63 48,70 Z" fill="url(#rubyHeart)"/>
  </g>
  <g class="float-heart-2">
    <path d="M 232,65 C 228,59 218,61 218,71 C 218,80 232,88 232,88 C 232,88 246,80 246,71 C 246,61 236,59 232,65 Z" fill="url(#rubyHeart)"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="140" cy="218" rx="55" ry="11" fill="#e86b8b" class="ground-shadow-anim"/>

  <!-- Main Jumping Bear Rig -->
  <g class="bear-jumping-rig" filter="url(#premiumGlow)">

    <!-- Feet -->
    <g id="feet">
      <ellipse cx="114" cy="204" rx="17" ry="13" fill="url(#furGrad)" stroke="#f5c2ce" stroke-width="2"/>
      <ellipse cx="114" cy="205" rx="8" ry="6" fill="url(#innerEarGrad)"/>
      <circle cx="109" cy="198" r="2" fill="#ff7597"/>
      <circle cx="114" cy="196" r="2" fill="#ff7597"/>
      <circle cx="119" cy="198" r="2" fill="#ff7597"/>

      <ellipse cx="166" cy="204" rx="17" ry="13" fill="url(#furGrad)" stroke="#f5c2ce" stroke-width="2"/>
      <ellipse cx="166" cy="205" rx="8" ry="6" fill="url(#innerEarGrad)"/>
      <circle cx="161" cy="198" r="2" fill="#ff7597"/>
      <circle cx="166" cy="196" r="2" fill="#ff7597"/>
      <circle cx="171" cy="198" r="2" fill="#ff7597"/>
    </g>

    <!-- Body -->
    <ellipse cx="140" cy="166" rx="46" ry="40" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <ellipse cx="140" cy="170" rx="30" ry="25" fill="url(#bellyGrad)"/>

    <!-- Left Ear with Ribbon Bow -->
    <circle cx="98" cy="84" r="20" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <circle cx="98" cy="84" r="11" fill="url(#innerEarGrad)"/>
    <ellipse cx="96" cy="80" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>

    <!-- Cute Valentine Pink Ribbon Bow on Ear -->
    <g transform="translate(82, 68)">
      <polygon points="4,3 12,8 4,13" fill="url(#ribbonGrad)"/>
      <polygon points="20,3 12,8 20,13" fill="url(#ribbonGrad)"/>
      <circle cx="12" cy="8" r="3.5" fill="#ff2e63"/>
      <circle cx="11" cy="7" r="1.2" fill="#ffffff"/>
    </g>

    <!-- Right Ear -->
    <circle cx="182" cy="84" r="20" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <circle cx="182" cy="84" r="11" fill="url(#innerEarGrad)"/>
    <ellipse cx="180" cy="80" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>

    <!-- Head -->
    <circle cx="140" cy="116" r="48" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <ellipse cx="140" cy="95" rx="28" ry="14" fill="#ffffff" opacity="0.45"/>

    <!-- Eyes (Loving Glossy Kawaii with Heart Twinkle) -->
    <g class="eye-blink-anim">
      <g transform="translate(118, 114)">
        <ellipse cx="0" cy="0" rx="6.5" ry="8.5" fill="#2d131b"/>
        <ellipse cx="-2" cy="-3" rx="2.8" ry="3.5" fill="#ffffff"/>
        <circle cx="2.2" cy="3" r="1.3" fill="#ffffff"/>
      </g>
      <g transform="translate(162, 114)">
        <ellipse cx="0" cy="0" rx="6.5" ry="8.5" fill="#2d131b"/>
        <ellipse cx="-2" cy="-3" rx="2.8" ry="3.5" fill="#ffffff"/>
        <circle cx="2.2" cy="3" r="1.3" fill="#ffffff"/>
      </g>
    </g>

    <!-- Blushing Cheeks -->
    <circle cx="110" cy="126" r="13" fill="url(#blushGrad)"/>
    <circle cx="170" cy="126" r="13" fill="url(#blushGrad)"/>
    <circle cx="108" cy="123" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="172" cy="123" r="2" fill="#ffffff" opacity="0.7"/>

    <!-- Snout & Nose -->
    <ellipse cx="140" cy="126" rx="14" ry="10" fill="#ffffff" stroke="#fce4ec" stroke-width="1.5"/>
    <ellipse cx="140" cy="122" rx="5.5" ry="3.8" fill="#441a28"/>
    <ellipse cx="138.5" cy="120.8" rx="2" ry="1.2" fill="#ffffff" opacity="0.8"/>
    <path d="M 140 125.5 Q 134 133 129 129" fill="none" stroke="#441a28" stroke-width="2" stroke-linecap="round"/>
    <path d="M 140 125.5 Q 146 133 151 129" fill="none" stroke="#441a28" stroke-width="2" stroke-linecap="round"/>

    <!-- Big Pulsating Ruby Heart in Hands with Luminous Gloss -->
    <g class="heart-beat-anim">
      <!-- Glow Filter Circle -->
      <circle cx="140" cy="168" r="26" fill="url(#heartGlow)" opacity="0.55"/>
      <!-- 3D Heart Shape -->
      <path d="M 140,154 C 132,138 108,142 108,162 C 108,180 140,196 140,196 C 140,196 172,180 172,162 C 172,142 148,138 140,154 Z" fill="url(#rubyHeart)"/>
      <!-- Curving Gloss Highlight on Left Cusp -->
      <ellipse cx="120" cy="154" rx="6" ry="3.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 120 154)"/>
    </g>

    <!-- Bear Paws Hugging the Heart Lovingly -->
    <ellipse cx="112" cy="172" rx="11" ry="9" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2"/>
    <ellipse cx="168" cy="172" rx="11" ry="9" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2"/>

  </g>
</svg>
